<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%PAGE_DESCRIPTION%" />
    <!-- リンクを貼ったときの表示（OGP）。値は src/config.ts で変える -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="長岡念珠店" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%PAGE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%OGP_IMAGE_URL%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="paper" aria-hidden="true"></div>

    <!-- プレイ中の表示 -->
    <div id="hud" hidden>
      <div id="lives" aria-label="残り回数"></div>
      <div id="center">
        <div id="score"><span class="label">和紙</span> <b id="washi-count">0</b><span class="goal">／120</span></div>
        <div id="glow" hidden aria-label="念珠の無敵の残り時間">
          <span class="label">念珠</span><span class="bar"><i id="glow-bar"></i></span><b id="glow-sec">8</b>
        </div>
      </div>
      <button id="pause-btn" class="icon-btn" aria-label="一時停止">
        <svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>
    <div id="toast"></div>

    <!-- タイトル画面 -->
    <section id="title" class="screen">
      <div class="title-box">
        <h1 id="game-title"></h1>
        <p class="yomi" id="subtitle"></p>
        <button id="start-btn" class="main-btn">はじめる</button>
        <p class="hint" id="how-to"></p>
      </div>
      <button id="sound-btn" class="small-btn" aria-pressed="false">音：オフ</button>
      <a class="shop shop-link" target="_blank" rel="noopener">制作：長岡念珠店</a>
    </section>

    <!-- 一時停止 -->
    <section id="pause" class="screen dim" hidden>
      <div class="panel">
        <h2>一時停止</h2>
        <button id="resume-btn" class="main-btn">つづける</button>
        <button id="quit-btn" class="sub-btn">タイトルへ</button>
      </div>
    </section>

    <!-- クリア演出（第5章）：西掛所の境内で北斎が大だるま絵を描き、櫓に引き上げる → クリア画面 -->
    <section id="clear" class="screen" hidden>
      <div id="clear-stage">
        <div id="keidai">
          <!-- 境内の奥の本堂の大屋根（墨の影） -->
          <svg id="hondo" viewBox="0 0 512 160" aria-hidden="true">
            <path d="M10 150 Q80 134 120 84 L190 34 L322 34 L392 84 Q432 134 502 150 Q256 136 10 150 Z"/>
            <rect x="176" y="24" width="160" height="12"/>
            <rect x="96" y="140" width="320" height="20"/>
          </svg>
          <div id="ground3d">
            <div id="sheet-wrap">
              <!-- 櫓（引き上げたあとに現れる） -->
              <svg id="yagura" viewBox="-40 -60 300 470" aria-hidden="true">
                <path class="pole" d="M-16 -50 L-22 410 M236 -50 L242 410"/>
                <path class="beam" d="M-30 -30 L250 -30"/>
                <path class="brace" d="M-18 260 L238 120 M238 260 L-18 120 M-20 300 L240 300"/>
                <path class="rope" d="M20 -30 L20 4 M110 -30 L110 4 M200 -30 L200 4"/>
              </svg>
              <div id="sheet">
                <!-- 大だるま絵：北斎の大だるまに似せたオリジナル（パロディ）。眉間 → 鼻 → 目 → 顔の輪郭 → 衣 の順に描く -->
                <svg id="daruma-art" viewBox="0 0 220 360" aria-label="大だるま絵">
                  <defs>
                    <filter id="brushy" x="-5%" y="-5%" width="110%" height="110%">
                      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="n"/>
                      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
                    </filter>
                  </defs>
                  <rect class="paper" x="0" y="0" width="220" height="360"/>
                  <path class="wash" fill-rule="evenodd" d="M54 108 Q40 30 110 22 Q180 30 166 108 Q190 196 206 250 Q214 300 214 354 L6 354 Q6 300 14 250 Q30 196 54 108 Z M64 104 Q110 70 156 104 Q170 200 110 262 Q50 200 64 104 Z"/>
                  <g class="ink" filter="url(#brushy)">
                    <g data-part="眉間"><path class="w5" d="M104 116 Q107 126 104 136"/><path class="w5" d="M116 116 Q113 126 116 136"/></g>
                    <g data-part="鼻"><path class="w7" d="M110 138 Q102 160 94 176 Q100 186 110 182 Q120 188 128 178"/><path class="w4" d="M98 178 Q102 173 106 179"/><path class="w4" d="M114 179 Q118 173 122 178"/></g>
                    <g data-part="目">
                      <path class="w13" d="M52 112 Q70 84 102 104"/><path class="w13" d="M168 112 Q150 84 118 104"/>
                      <circle class="w6" cx="82" cy="132" r="16"/><circle class="w6" cx="138" cy="132" r="16"/>
                      <path class="w4" d="M62 124 Q82 110 102 124"/><path class="w4" d="M118 124 Q138 110 158 124"/>
                      <circle class="pupil" cx="89" cy="128" r="7"/><circle class="pupil" cx="145" cy="128" r="7"/>
                    </g>
                    <g data-part="顔の輪郭">
                      <path class="w8" d="M54 108 Q44 160 64 200"/><path class="w8" d="M166 108 Q176 160 156 200"/>
                      <path class="w6" d="M50 128 Q34 146 50 166"/><path class="w6" d="M170 128 Q186 146 170 166"/>
                      <circle class="w5" cx="44" cy="178" r="8"/>
                      <path class="w9" d="M76 196 Q110 178 144 196"/><path class="w5" d="M96 205 Q110 213 124 205"/>
                      <path class="w9" d="M64 200 Q74 246 110 258 Q146 246 156 200"/>
                      <path class="w4" d="M84 214 Q90 236 96 246"/><path class="w4" d="M110 216 L110 252"/><path class="w4" d="M136 214 Q130 236 124 246"/>
                    </g>
                    <g data-part="衣">
                      <path class="w12 shu" d="M54 108 Q40 30 110 22 Q180 30 166 108"/>
                      <path class="w12 shu" d="M48 116 Q30 196 14 250"/><path class="w12 shu" d="M172 116 Q190 196 206 250"/>
                      <path class="w12 shu" d="M14 250 Q6 300 6 354"/><path class="w12 shu" d="M206 250 Q214 300 214 354"/>
                      <path class="w10 shu" d="M66 228 Q110 280 154 228"/>
                      <path class="w8 shu" d="M44 270 Q70 300 66 354"/><path class="w8 shu" d="M176 270 Q150 300 154 354"/><path class="w8 shu" d="M100 286 Q112 320 104 354"/>
                    </g>
                  </g>
                </svg>
              </div>
              <!-- 北斎（後ろ姿）。大筆の穂先が、いま描いている線の先に来る -->
              <svg id="hokusai" viewBox="0 0 60 100" aria-hidden="true">
                <path class="brush-handle" d="M44 44 L11 90"/>
                <ellipse class="brush-head" cx="9" cy="93" rx="6" ry="8" transform="rotate(30 9 93)"/>
                <path class="kimono" d="M22 40 L44 40 L52 97 L14 97 Z"/>
                <rect class="obi" x="19" y="60" width="29" height="6"/>
                <path class="arm" d="M24 46 L16 70 L22 74 M42 46 L44 60 L38 66"/>
                <circle class="head" cx="33" cy="30" r="9"/>
                <path class="hair" d="M25 27 Q33 18 41 27 Q37 24 33 24 Q29 24 25 27 Z"/>
              </svg>
            </div>
          </div>
          <!-- 見物人 -->
          <svg id="crowd" viewBox="0 0 400 40" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
        </div>
        <p id="clear-title">大だるま絵 完成</p>
        <p id="skip-hint">画面をタップすると飛ばせます</p>
      </div>
      <div class="panel result" id="clear-panel" hidden>
        <h2>大だるま絵 完成</h2>
        <table>
          <tr><th>クリアまでの時間</th><td><b id="c-time">0分00秒</b> <span id="c-time-new" class="new" hidden>新記録</span></td><td class="best">ベスト <span id="cb-time">-</span></td></tr>
          <tr><th>残り回数</th><td><b id="c-lives">0</b> 回 <span id="c-lives-new" class="new" hidden>新記録</span></td><td class="best">ベスト <span id="cb-lives">0</span> 回</td></tr>
        </table>
        <p class="story story-text"></p>
        <div class="buttons">
          <button id="c-retry-btn" class="main-btn">もう一度</button>
          <a id="c-share-btn" class="link-btn" target="_blank" rel="noopener">Xで共有</a>
        </div>
        <button id="c-title-btn" class="sub-btn">タイトルへ</button>
        <a class="credit shop-link" target="_blank" rel="noopener">制作：長岡念珠店</a>
      </div>
    </section>

    <!-- 結果画面（途中で終わったとき） -->
    <section id="result" class="screen dim" hidden>
      <div class="panel result">
        <p class="big"><b id="r-washi">0</b> 畳まで集まりました <span id="r-washi-new" class="new" hidden>新記録</span></p>
        <p class="best">ベスト <span id="b-washi">0</span> 畳</p>
        <p class="cheer" id="r-cheer"></p>
        <p class="story story-text"></p>
        <div class="buttons">
          <button id="retry-btn" class="main-btn">もう一度</button>
          <a id="share-btn" class="link-btn" target="_blank" rel="noopener">Xで共有</a>
        </div>
        <button id="title-btn" class="sub-btn">タイトルへ</button>
        <a class="credit shop-link" target="_blank" rel="noopener">制作：長岡念珠店</a>
      </div>
    </section>

    <!-- スマホを縦に持っているとき -->
    <section id="rotate" class="screen" hidden>
      <svg viewBox="0 0 120 120" width="120" height="120" class="rotate-icon" aria-hidden="true">
        <rect x="42" y="20" width="36" height="64" rx="6" fill="none" stroke="#222" stroke-width="4"/>
        <path d="M30 92 A40 40 0 0 0 96 80" fill="none" stroke="#c0392b" stroke-width="4"/>
        <path d="M96 80 l-12 2 l8 9 z" fill="#c0392b"/>
      </svg>
      <p>横にしてお楽しみください</p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
